<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리뷰·문의 정리 | 무숙녀 고객센터</title>
  <meta name="description" content="리뷰와 문의 엑셀을 올리면 지저분한 줄을 걸러 내고 개인정보를 가려 정리합니다.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- 순서 중요: SheetJS(엑셀 읽기) → 설정 → 정리 → 읽기 → 화면 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/clean.js" defer></script>
  <script src="js/read.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="top">
    <p class="brand">무숙녀 고객센터</p>
  </header>

  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">리뷰·문의 정리</h1>
      <p class="lead">쇼핑몰에서 내려받은 리뷰와 문의 엑셀을 올리면, 제목 줄과 빈 줄, 중복을 걸러 내고 전화번호 같은 개인정보를 가려서 보여 줍니다. 올린 파일은 이 브라우저 안에서만 처리돼요.</p>
    </section>

    <!-- 옷에 다는 행택 모양의 파일 놓는 곳 -->
    <label class="tag" id="drop" for="file">
      <span class="tag__hole" aria-hidden="true"></span>
      <span class="tag__body">
        <strong class="tag__title">엑셀 파일을 여기에 놓으세요</strong>
        <span class="tag__sub">눌러서 고를 수도 있어요 (xlsx, xls, csv)</span>
      </span>
      <input id="file" class="tag__input" type="file" accept=".xlsx,.xls,.csv">
    </label>
    <div class="actions">
      <button type="button" class="btn btn--ghost" id="sample">샘플 파일로 해 보기</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <section id="results" class="results" hidden aria-labelledby="steps-title">
      <div class="results__head">
        <h2 id="steps-title">정리 기록</h2>
        <button type="button" class="btn" id="download">정리된 파일 받기</button>
      </div>
      <ol class="steps" id="steps"></ol>

      <div class="preview__head">
        <h2>미리보기</h2>
        <div class="filters">
          <label class="check"><input type="checkbox" id="only-masked"> 개인정보를 가린 글만</label>
          <label class="check"><input type="checkbox" id="show-original"> 원문으로 보기</label>
        </div>
      </div>
      <p class="hint">AI에는 가린 글만 보냅니다. 원문 보기는 가린 결과가 맞는지 이 화면에서 확인하는 용도예요.</p>
      <div class="table-wrap" tabindex="0" aria-label="정리된 글 표 (가로로 넘겨 볼 수 있어요)">
        <table>
          <thead><tr><th>번호</th><th>작성일시</th><th>구분</th><th>상품명</th><th>옵션</th><th class="num">별점</th><th>내용</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="more">
        <span id="count"></span>
        <button type="button" class="btn btn--ghost" id="more">50건 더 보기</button>
      </div>
    </section>
  </main>
</body>
</html>
